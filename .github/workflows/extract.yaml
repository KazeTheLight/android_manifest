name: K-One-Kernel — Extract Image

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Nama artifact (KOSONGKAN = otomatis pakai kernel terbaru)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Cari artifact kernel
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
               -o art.json

          echo "=== semua artifact di ${GITHUB_REPOSITORY} ==="
          jq -r '.artifacts
                 | sort_by(.created_at) | reverse
                 | .[] | "\(.created_at[0:19])  \(.size_in_bytes/1048576*100|round/100) MB  expired=\(.expired)  \(.name)"' \
               art.json
          echo

          SEL=$(jq -r --arg w "$WANT" '
            [ .artifacts[]
              | select(.name | test("^K-One-Kernel-dist-[0-9]{8}"))
              | select(.expired == false) ]
            | sort_by(.created_at) | reverse
            | (if ($w|length)>0 then (map(select(.name==$w)) | .[0]) else .[0] end)
            | if . == null then empty else "\(.id)\t\(.name)" end
          ' art.json)

          if [ -z "$SEL" ]; then
            echo "ERROR: artifact tidak ditemukan (diminta: '${WANT}')"
            jq -r '.artifacts[] | select(.name | test("^K-One-Kernel-dist-[0-9]{8}")) | .name' art.json
            exit 1
          fi

          echo ">>> TERPILIH: $(echo "$SEL" | cut -f2)  (id $(echo "$SEL" | cut -f1))"
          echo "id=$(echo "$SEL" | cut -f1)"   >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$SEL" | cut -f2)" >> "$GITHUB_OUTPUT"

      - name: Download artifact terpilih
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.find.outputs.id }}/zip" \
               -o artifact.zip
          ls -la artifact.zip
          mkdir -p artifact-src
          unzip -q artifact.zip -d artifact-src

      - name: Buka nested zip (artifact = .zip di dalam .zip)
        run: |
          set -euo pipefail
          DEPTH=0
          while [ "$DEPTH" -lt 5 ]; do
            Z=$(find artifact-src -type f -name "*.zip" | head -1 || true)
            [ -n "$Z" ] || break
            DEPTH=$((DEPTH + 1))
            DIR="$(dirname "$Z")/x${DEPTH}"
            echo ">>> [$DEPTH] membuka $(basename "$Z") -> $DIR"
            mkdir -p "$DIR"
            unzip -q -o "$Z" -d "$DIR"
            rm -f "$Z"
          done
          echo "=== tingkat bukaan: $DEPTH ==="
          echo "=== struktur (depth 3) ==="
          find artifact-src -maxdepth 3 | head -60

      - name: Temukan Image
        run: |
          set -euo pipefail
          cd artifact-src
          echo "=== kandidat Image / vmlinux ==="
          find . -type f \( -name "Image" -o -name "Image.*" -o -name "Image-*" -o -name "vmlinux" \) \
            -printf "%s\t%p\n" | sort -rn | head -20

      - name: Salin Image
        run: |
          set -euo pipefail
          cd artifact-src
          IMG=$(find . -type f \( -name "Image" -o -name "Image.*" -o -name "Image-*" \) \
                ! -name "*.dtb" -printf "%s\t%p\n" | sort -rn | head -1 | cut -f2-)
          if [ -z "$IMG" ]; then
            echo "ERROR: tidak ada file Image"; find . -maxdepth 4 -type d | head -40; exit 1
          fi
          echo "=== IMAGE: $IMG ==="
          ls -la "$IMG"
          file "$IMG" || true
          sha256sum "$IMG"
          mkdir -p ../out
          cp "$IMG" "../out/$(basename "$IMG")"
          echo
          ls -la ../out/

      - name: Laporkan versi kernel dari dalam Image
        run: |
          set -euo pipefail
          for f in out/*; do
            [ -f "$f" ] || continue
            echo "######## $f ########"
            echo "--- 32 byte pertama ---"
            xxd -l 32 "$f" || true
            TMP=$(mktemp)
            case "$f" in
              *.gz)  gunzip -c "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *.lz4) lz4 -d -c "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *.xz)  xz -dc  "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *)     cp "$f" "$TMP" ;;
            esac
            echo "--- version string ---"
            strings "$TMP" | grep -m3 -E "Linux version [0-9]" || echo "  (tidak ketemu)"
            echo "--- jejak klee ---"
            strings "$TMP" | grep -m3 -iE "klee" || echo "  (tidak ada)"
            echo
            rm -f "$TMP"
          done

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: K-One-Kernel-Image
          path: out/
          if-no-files-found: error
          retention-days: 30
