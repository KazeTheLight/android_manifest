name: Setup Linux 6.12 Base Repos for Klee

on:
  workflow_dispatch:
    inputs:
      aosp_612_branch:
        description: 'Branch AOSP GKI 6.12 target (android16-6.12 atau android15-6.12)'
        default: 'android16-6.12'
      target_branch:
        description: 'Nama branch baru di fork KazeTheLight'
        default: 'bsp-klee-6.12'
      vendor_source_url:
        description: 'URL git sumber vendor_mediatek_kernel_modules (kosongkan untuk auto-detect)'
        default: ''

jobs:
  prepare-612:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          git config --global user.name "KazeTheLight-CI"
          git config --global user.email "ci@users.noreply.github.com"

      - name: Clone & Push Branch for device_modules
        env:
          TOKEN: ${{ secrets.BLOB_PUSH_TOKEN }}
          BR: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git clone --depth=1 -b bsp-klee-w-oss "https://github.com/xiaomi-klee-devs/android_kernel_device_modules-6.6.git" dev_mod 2>/dev/null || \
          git clone --depth=1 "https://github.com/xiaomi-klee-devs/android_kernel_device_modules-6.6.git" dev_mod
          cd dev_mod
          git checkout -B "$BR"
          git push -f "https://x-access-token:${TOKEN}@github.com/KazeTheLight/android_kernel_device_modules-6.6.git" "$BR"
          cd ..
          rm -rf dev_mod

      - name: Auto-detect & Push vendor_mediatek_kernel_modules
        env:
          TOKEN: ${{ secrets.BLOB_PUSH_TOKEN }}
          BR: ${{ inputs.target_branch }}
          CUSTOM_URL: ${{ inputs.vendor_source_url }}
        run: |
          set -euo pipefail
          CANDIDATES=(
            "$CUSTOM_URL"
            "https://github.com/xiaomi-klee-devs/android_vendor_mediatek_kernel_modules.git"
            "https://github.com/LineageOS/android_vendor_mediatek_kernel_modules.git"
          )
          FOUND=0
          for URL in "${CANDIDATES[@]}"; do
            [ -z "$URL" ] && continue
            echo "Mencoba: $URL ..."
            if git clone --depth=1 -b bsp-klee-w-oss "$URL" vendor_mod 2>/dev/null || \
               git clone --depth=1 "$URL" vendor_mod 2>/dev/null; then
              echo "Berhasil clone dari: $URL"
              FOUND=1
              break
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::Tidak ditemukan mirror publik otomatis untuk android_vendor_mediatek_kernel_modules."
            exit 0
          fi

          cd vendor_mod
          git checkout -B "$BR"
          git push -f "https://x-access-token:${TOKEN}@github.com/KazeTheLight/android_vendor_mediatek_kernel_modules.git" "$BR"
          cd ..
          rm -rf vendor_mod

      - name: Inspect MTK/Xiaomi Commits on android_kernel-6.6
        run: |
          set -euo pipefail
          mkdir -p work
          git clone --depth=150 -b bsp-klee-w-oss https://github.com/xiaomi-klee-devs/android_kernel-6.6.git work/k66 2>/dev/null || \
          git clone --depth=150 https://github.com/xiaomi-klee-devs/android_kernel-6.6.git work/k66
          cd work/k66
          echo "=== Branch aktif k66: $(git branch --show-current) ==="
          echo "=== 40 Commit Teratas di klee 6.6 ==="
          git log --oneline -n 40 | tee ../../commits_k66.txt

          BASE_COMMIT=$(git log --grep="ANDROID:" --author="google.com" --format="%H" -n 1 || true)
          if [ -z "$BASE_COMMIT" ]; then
            BASE_COMMIT=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Detected AOSP Base Commit: $BASE_COMMIT"
          mkdir -p ../../mtk_patches
          git format-patch "${BASE_COMMIT}..HEAD" -o ../../mtk_patches || true
          ls -lh ../../mtk_patches | tee ../../patch_list.txt

      - name: Fetch AOSP 6.12 & Apply MTK Files
        env:
          AOSP_BR: ${{ inputs.aosp_612_branch }}
          BR: ${{ inputs.target_branch }}
          TOKEN: ${{ secrets.BLOB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          # Cek daftar branch 6.12 yang tersedia di AOSP kernel/common jika input utama gagal
          if ! git clone
          
