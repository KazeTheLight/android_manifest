name: K-One-Kernel — Build & Release

on:
  workflow_dispatch:
    inputs:
      package_full:
        description: 'Buat artifact lengkap (~900MB)? false = hanya Image kecil'
        type: boolean
        default: false
      use_cache:
        description: 'Pakai cache objek git repo? (hemat sync, boros kuota cache)'
        type: boolean
        default: true

# Serialisasi run: dispatch kedua menunggu, tidak membatalkan build 40 menit yang
# sedang jalan. Naikkan ke true bila kamu memang ingin run terbaru mengalahkan
# run lama.
concurrency:
  group: kok-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KERNEL_MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  KERNEL_MANIFEST_BRANCH: common-android15-6.6-2025-09
  LOCAL_MANIFEST_REPO: https://github.com/KazeTheLight/android_manifest
  KDIR: kernel-6.6
  DMDIR: kernel_device_modules-6.6
  # Bump nilai ini untuk memaksa cache objek git dibangun ulang dari nol.
  REPO_CACHE_VERSION: '3'
  # Bump nilai ini bila format cache out/ berubah atau perlu clean slate.
  # Bump juga sekali lagi setelah migrasi ke kunci berbasis-isi-file, supaya
  # cache lama yang kuncinya berbasis hashFiles(patches/**) tidak pernah
  # terbaca dan tidak memenuhi kuota repo tanpa pernah dipakai.
  OUT_CACHE_VERSION: '2'
  # Daftar file yang disentuh patch. Diisi oleh langkah "Terapkan patch", lalu
  # dipakai untuk menghitung kunci cache dari isi file, bukan nama file patch.
  PATCHED_FILES: /tmp/patched_files.txt

defaults:
  run:
    shell: bash

jobs:
  build_kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      date: ${{ steps.setdate.outputs.date }}
      version: ${{ steps.report.outputs.version }}
    env:
      ARTIFACT: ${{ github.workspace }}/artifact
      IMGOUT: ${{ github.workspace }}/image-out

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate build date
        id: setdate
        run: |
          set -euo pipefail
          d="$(TZ=Asia/Jakarta date +%Y%m%d%H%M)"
          echo "date=$d" >> "$GITHUB_OUTPUT"
          #_step output tidak bisa dibaca sebagai env.DATE di step lain, jadi
          # taruh juga ke environment agar nama artifact konsisten.
          echo "DATE=$d" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p ~/.bin
          # -f: gagal kalau HTTP error, -L: ikuti redirect, -S: tampilkan error.
          # Tanpa ini, halaman error GitHub bisa tersimpan sebagai "repo".
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          # Launcher repo adalah skrip Python yang diawali "#!". Cek ini
          # menangkap halaman error yang lolos dari -f, misalnya proxy yang
          # membalas 200 dengan HTML. Jangan cari teks "repo": 64 byte pertama
          # tidak memuat kata itu sama sekali.
          [ -s ~/.bin/repo ] \
            || { echo "::error::repo launcher kosong"; exit 1; }
          head -c 2 ~/.bin/repo | grep -q '#!' \
            || { echo "::error::repo launcher bukan skrip yang bisa dijalankan"; exit 1; }
          ~/.bin/repo --version >/dev/null
          echo "$HOME/.bin" >> "$GITHUB_PATH"

          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler python3 lz4 zip unzip

      - name: Restore cache objek git
        if: inputs.use_cache
        uses: actions/cache@v4
        with:
          path: |
            .repo/project-objects
            .repo/projects
          key: kok-repo-${{ runner.os }}-${{ env.REPO_CACHE_VERSION }}-${{ env.KERNEL_MANIFEST_BRANCH }}-${{ hashFiles('local_manifest.xml') }}
          restore-keys: |
            kok-repo-${{ runner.os }}-${{ env.REPO_CACHE_VERSION }}-${{ env.KERNEL_MANIFEST_BRANCH }}-

      # Cache output build sengaja dipindahkan ke setelah patch, bukan sebelum.
      # Kuncinya dihitung dari isi file HASIL patch, jadi repo harus sudah
      # di-patch dulu. Kunci lama memakai hashFiles('patches/**'), yang membuat
      # rename atau renumber patch membatalkan cache meski output kernel identik.
      - name: Sync kernel source

        run: |
          set -euo pipefail
          repo init -u "$KERNEL_MANIFEST_URL" -b "$KERNEL_MANIFEST_BRANCH" --depth=1
          git clone --depth=1 "$LOCAL_MANIFEST_REPO" .repo/local_manifests
          # --optimized-fetch memakai objek yang sudah ada di cache dan hanya
          # menarik yang kurang. --force-sync sengaja dihapus: workspace selalu
          # kosong, jadi checkout ulang tidak memberi manfaat dan hanya lambat.
          repo sync -j"$(nproc --all)" --no-clone-bundle --no-tags \
            --optimized-fetch --fail-fast
          for d in "$KDIR" "$DMDIR"; do
            [ -d "$d" ] || { echo "::error::$d tidak ada setelah sync"; exit 1; }
          done

      - name: Terapkan patch K-One-Kernel
        run: |
          set -euo pipefail
          shopt -s nullglob

          # apply_patches <tree> <direktori patch> <required|optional>
          apply_patches() {
            local tree="$1" dir="$2" mode="$3"
            local -a found=( "$dir"/*.patch )
            if [ ${#found[@]} -eq 0 ]; then
              if [ "$mode" = required ]; then
                echo "::error::tidak ada patch di $dir/*.patch"; exit 1
              fi
              echo "::notice::tidak ada patch di $dir, langkah dilewati"
              return 0
            fi
            [ -d "$tree" ] || { echo "::error::$tree tidak ada di workspace"; exit 1; }
            for p in "${found[@]}"; do
              echo "--- $p -> $tree"
              # --batch: jangan pernah interaktif. Tanpa itu `patch` meminta
              # "File to patch:" dan di runner tanpa TTY bisa menelan sisa patch
              # sebagai jawaban lalu exit 0 tanpa Apply patch sama sekali.
              # --reject-file=-: tolak ditulis ke log, bukan file .rej di tree.
              patch -p1 -d "$tree" --forward --batch --no-backup-if-mismatch \
                --reject-file=- < "$p"
              # Catat file yang disentuh. Daftar ini dipakai langkah "Hitung
              # kunci cache" supaya kunci cache berbasis isi file hasil patch,
              # bukan nama file patch. Kalau tidak, me-rename atau me-reorder
              # patch membatalkan cache padahal output kernel identik.
              grep -E '^\+\+\+ b/' "$p" | sed 's|^+++ b/||' >> "$PATCHED_FILES"
            done
            # Periksa sisa .rej sebagai jaring pengaman tambahan: dengan
            # --forward, patch yang sudah ter-apply dilewati dan patch yang
            # tidak cocok bisa lolos tanpa terlihat di ringkasan. Tree CI selalu
            # bersih karena hanya .repo yang di-cache, bukan worktree.
            local rej
            rej=$(find "$tree" -name '*.rej' -print -quit)
            if [ -n "$rej" ]; then
              echo "::error::patch ditolak, ditemukan:"
              find "$tree" -name '*.rej' -print
              exit 1
            fi
          }

          : > "$PATCHED_FILES"
          apply_patches "$KDIR" patches required
          apply_patches "$DMDIR" patches-modules optional

          echo
          echo "=== verifikasi hasil patch ==="
          grep -n '^NAME = ' "$KDIR/Makefile"
          if ! grep -q '^CONFIG_LOCALVERSION="-K-One-Kernel"$' \
               "$KDIR/arch/arm64/configs/gki_defconfig"; then
            echo "::error::CONFIG_LOCALVERSION tidak sesuai harapan setelah patch"
            exit 1
          fi
          grep -n '^CONFIG_LOCALVERSION' "$KDIR/arch/arm64/configs/gki_defconfig"
          echo "::notice title=Localversion::diharapkan uname -r = 6.6.89-android15-8-maybe-dirty-K-One-Kernel"

      - name: Hapus KernelSU
        run: |
          set -euo pipefail
          DEFCONFIG="$KDIR/arch/arm64/configs/gki_defconfig"

          echo "=== CONFIG_KSU sebelum ==="
          grep -n 'CONFIG_KSU' "$DEFCONFIG" || echo "  (tidak ada)"

          sed -i 's/^CONFIG_KSU=y$/# CONFIG_KSU is not set/' "$DEFCONFIG"
          sed -i '/kernelsu/d' "$KDIR/drivers/Kconfig" "$KDIR/drivers/Makefile"
          rm -rf "$KDIR/drivers/kernelsu"

          echo
          echo "=== verifikasi ==="
          if grep -qE '^CONFIG_KSU' "$DEFCONFIG"; then
            echo "::error::CONFIG_KSU masih aktif di defconfig"; exit 1
          fi
          if grep -n 'kernelsu' "$KDIR/drivers/Kconfig" "$KDIR/drivers/Makefile"; then
            echo "::error::masih ada referensi kernelsu di Kconfig/Makefile"; exit 1
          fi
          if [ -d "$KDIR/drivers/kernelsu" ]; then
            echo "::error::folder drivers/kernelsu masih ada"; exit 1
          fi
          echo "OK: KernelSU dibuang dari tree"

      # Kunci cache dihitung dari isi file yang benar-benar berubah, bukan dari
      # hashFiles('patches/**'). Alasannya: output kernel ditentukan oleh isi
      # akhir file, bukan oleh nama atau urutan file patch. Dengan kunci lama,
      # me-rename atau me-reorder patch membatalkan cache meski kernel yang
      # dihasilkan identik.
      #
      # KernelSU removal di atas juga mengubah file, jadi kunci harus dihitung
      # setelah langkah itu, bukan setelah patch saja.
      - name: Hitung kunci cache
        id: cachekey
        run: |
          set -euo pipefail
          echo "=== file yang disentuh patch ==="
          sort -u "$PATCHED_FILES" | tee /dev/stderr | wc -l

          # Hash isi file, bukan path-nya. Patch yang menyentuh file berbeda tapi
          # menghasilkan isi identik akan menghasilkan kunci sama, yang memang
          # benar karena output build-nya sama.
          HASH_INPUT=$(mktemp)
          while read -r f; do
            [ -n "$f" ] || continue
            for tree in "$KDIR" "$DMDIR"; do
              if [ -f "$tree/$f" ]; then
                { printf '%s\0' "$f"; cat "$tree/$f"; } >> "$HASH_INPUT"
              fi
            done
          done < <(sort -u "$PATCHED_FILES")
          HASH=$(sha256sum "$HASH_INPUT" | cut -c1-32)
          rm -f "$HASH_INPUT"

          # local_manifest.xml menentukan tag sumber upstream, jadi tetap masuk.
          MHASH=$(sha256sum local_manifest.xml | cut -c1-16)
          echo "kunci cache out: $MHASH-$HASH"
          echo "key=$MHASH-$HASH" >> "$GITHUB_OUTPUT"

      # Cache output build. Ini penghematan terbesar: saat repo dan isi file
      # hasil patch tidak berubah, Bazel bisa melewati sebagian besar compile.
      - name: Restore cache output build
        if: inputs.use_cache
        uses: actions/cache@v4
        with:
          path: |
            out
            ${{ runner.temp }}/bazel_disk_cache
          key: kok-out-${{ runner.os }}-${{ env.OUT_CACHE_VERSION }}-${{ steps.cachekey.outputs.key }}
          restore-keys: |
            kok-out-${{ runner.os }}-${{ env.OUT_CACHE_VERSION }}-

      - name: Fix Ubuntu 24.04 sandbox restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build kernel
        run: |
          set -euo pipefail
          CPU=$(nproc --all)
          echo "  CPU terdeteksi : ${CPU}"
          echo "  RAM            : $(free -g | awk '/^Mem:/{print $2}') GB"

          # Argumen Bazel disuntikkan lewat bazelrc yang di-generate di sini.
          # Menulis build.sh milik device modules tidak aman: folder itu
          # di-sync ulang setiap run sehingga edit-an lokal hilang.
          RC="$RUNNER_TEMP/ci_fast.bazelrc"
          mkdir -p "$RUNNER_TEMP/bazel_disk_cache" "$RUNNER_TEMP/bazel_repo_cache"
          cat > "$RC" <<BAZELRC
          build --jobs=${CPU}
          build --incompatible_strict_action_env
          build --disk_cache=$RUNNER_TEMP/bazel_disk_cache
          build --repository_cache=$RUNNER_TEMP/bazel_repo_cache
          fetch --disk_cache=$RUNNER_TEMP/bazel_disk_cache
          fetch --repository_cache=$RUNNER_TEMP/bazel_repo_cache
          BAZELRC

          # build.sh memanggil tools/bazel. Bazel membaca bazelrc home
          # (/etc/bazel.bazelrc) dan milik workspace; BAZELRC menambah
          # milik kita tanpa menimpa yang lain.
          export BAZELRC="$RC"

          time ./$DMDIR/build.sh

      - name: Ekstrak Image + laporkan versi
        id: report
        run: |
          set -euo pipefail

          echo "=== out/ ==="
          ls -la out/ 2>/dev/null || echo "  (tidak ada out/)"
          echo

          # out/dist boleh menaruh Image dalam bentuk terkompresi, dan yang
          # terbesar dipilih apa adanya.
          IMG=$(find out/dist -type f \
                  \( -name 'Image' -o -name 'Image.*' -o -name 'Image-*' \) \
                  ! -name '*.dtb' -printf '%s\t%p\n' 2>/dev/null \
                | sort -rn | head -1 | cut -f2-)

          if [ -z "$IMG" ]; then
            echo "::error::tidak ada file Image di out/dist"
            exit 1
          fi

          echo "=== IMAGE TERPILIH: $IMG ==="
          ls -la "$IMG"
          file "$IMG" || true
          sha256sum "$IMG"

          mkdir -p "$IMGOUT"
          cp "$IMG" "$IMGOUT/$(basename "$IMG")"

          # Buka kompresi bila perlu, lalu satu kali pemindaian string dan
          # semua pemeriksaan memakai hasilnya.
          TMP=$(mktemp)
          STR=$(mktemp)
          trap 'rm -f "$TMP" "$STR"' EXIT
          case "$IMG" in
            *.gz)  gunzip -c "$IMG" > "$TMP" 2>/dev/null || cp "$IMG" "$TMP" ;;
            *.lz4) lz4 -d -c "$IMG" > "$TMP" 2>/dev/null || cp "$IMG" "$TMP" ;;
            *.xz)  xz -dc  "$IMG" > "$TMP" 2>/dev/null || cp "$IMG" "$TMP" ;;
            *)     cp "$IMG" "$TMP" ;;
          esac
          strings "$TMP" > "$STR"

          echo
          echo "--- Linux version string ---"
          VER=$(grep -m1 -E "Linux version [0-9]" "$STR" || true)
          if [ -n "$VER" ]; then
            echo "  $VER"
            echo "version=${VER#Linux version }" >> "$GITHUB_OUTPUT"
            echo "::notice title=Versi Kernel::$VER"
          else
            echo "  (tidak ketemu)"
            echo "version=unknown" >> "$GITHUB_OUTPUT"
          fi

          echo "--- jejak klee ---"
          grep -m3 -iE "klee" "$STR" || echo "  (tidak ada)"

          echo "--- scan marker ---"
          for M in raccoon kernelnext susfs patchv; do
            printf '  %-12s %s hit\n' "$M" "$(grep -ic "$M" "$STR" || true)"
          done

      - name: Paket AnyKernel (flashable)
        run: |
          set -euo pipefail

          if [ ! -d anykernel ]; then
            echo "::error::folder anykernel/ tidak ada di repo — commit template AnyKernel3 dulu"
            exit 1
          fi

          IMG=$(find "$IMGOUT" -maxdepth 1 -type f ! -name '*.gz' \
                  -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2-)
          if [ -z "$IMG" ]; then
            echo "::error::tidak ada Image di $IMGOUT"; exit 1
          fi

          WORK="$RUNNER_TEMP/ak"
          cp -r anykernel "$WORK"
          rm -f "$WORK"/Image "$WORK"/Image.gz "$WORK"/.gitignore

          # WAJIB: hanya Image.gz, taruh di ROOT zip (ak3-core.sh mencari di root)
          gzip -9 -c "$IMG" > "$WORK/Image.gz"
          echo "Image.gz: $(stat -c%s "$WORK/Image.gz") bytes  sha256=$(sha256sum "$WORK/Image.gz" | cut -d' ' -f1)"

          mkdir -p "$ARTIFACT"
          ZIP="$ARTIFACT/K-One-Kernel-${DATE}.zip"
          ( cd "$WORK" && zip -r9 "$ZIP" . )

          echo
          echo "=== isi zip (harus ada Image.gz + anykernel.sh di root) ==="
          unzip -l "$ZIP" | head -25

          LIST=$(unzip -Z1 "$ZIP")
          for req in Image.gz anykernel.sh META-INF/com/google/android/update-binary \
                     META-INF/com/google/android/updater-script tools/ak3-core.sh; do
            if ! printf '%s\n' "$LIST" | grep -qx "$req"; then
              echo "::error::$req tidak ada di root zip"; exit 1
            fi
          done
          if printf '%s\n' "$LIST" | grep -qx 'Image'; then
            echo "::error::ada Image polos di zip — akan menimpa Image.gz"; exit 1
          fi

          echo "OK: $ZIP"

      - name: Paket artifact lengkap
        if: inputs.package_full
        run: |
          set -euo pipefail
          cd out/dist
          zip -r9 "$ARTIFACT/K-One-Kernel-dist-${DATE}.zip" .
          ls -la "$ARTIFACT/"

      - name: Upload zip flashable AnyKernel
        uses: actions/upload-artifact@v4
        with:
          name: K-One-Kernel-${{ env.DATE }}
          path: ${{ env.ARTIFACT }}/K-One-Kernel-${{ env.DATE }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Image kecil
        uses: actions/upload-artifact@v4
        with:
          name: K-One-Kernel-Image-${{ env.DATE }}
          path: ${{ env.IMGOUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact lengkap
        if: inputs.package_full
        uses: actions/upload-artifact@v4
        with:
          name: K-One-Kernel-dist-${{ env.DATE }}
          path: ${{ env.ARTIFACT }}/K-One-Kernel-dist-${{ env.DATE }}.zip
          if-no-files-found: error
          retention-days: 14

      # Simpan cache hanya setelah build dan upload selesai, supaya out/
      # benar-benar berisi hasil build. Versi sebelumnya menaruh langkah
      # ini sebelum Sync kernel source, sehingga out/ belum ada dan
      # tidak ada yang tersimpan sama sekali.
      - name: Simpan cache output build
        if: inputs.use_cache && success()
        uses: actions/cache/save@v4
        with:
          path: |
            out
            ${{ runner.temp }}/bazel_disk_cache
          key: kok-out-${{ runner.os }}-${{ env.OUT_CACHE_VERSION }}-${{ steps.cachekey.outputs.key }}

  create_release:
    name: Create Release
    needs: build_kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: K-One-Kernel-${{ needs.build_kernel.outputs.date }}
      DATE: ${{ needs.build_kernel.outputs.date }}
      VERSION: ${{ needs.build_kernel.outputs.version }}

    steps:
      # Checkout itu wajib, bukan opsional. Langkah "Create git tag" menjalankan
      # `git tag` dan `git push origin`, dan tanpa checkout direktori kerja bukan
      # repo sehingga gagal dengan "fatal: not in a git directory".
      #
      # fetch-depth: 1 cukup karena yang dibutuhkan hanya direktori .git agar
      # git tag bisa membuat objek tag. Tidak ada history yang diopper, jadi
      # checkout ini tidak mengunduh repo penuh.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Unduh artifact dulu. Kalau ini gagal, workflow berhenti tanpa meninggalkan
      # tag kosong di origin — versi lama men-tag sebelum memverifikasi file.
      - name: Download zip flashable saja
        uses: actions/download-artifact@v4
        with:
          name: K-One-Kernel-${{ env.DATE }}
          path: release-asset

      - name: Verifikasi artifact
        run: |
          set -euo pipefail
          ZIP="release-asset/K-One-Kernel-${DATE}.zip"
          [ -s "$ZIP" ] || { echo "::error::$ZIP kosong atau hilang"; exit 1; }
          unzip -tq "$ZIP" || { echo "::error::zip flashable korup"; exit 1; }
          echo "sha256=$(sha256sum "$ZIP" | cut -d' ' -f1)"

      - name: Create git tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG sudah ada di origin, tunggu menit berikutnya agar tidak bentrok"
            exit 1
          fi
          git tag -a "$TAG" -m "K-One-Kernel $TAG"
          git push origin "$TAG"

      - name: Pasang zip flashable ke release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: K-One-Kernel ${{ env.DATE }}
          fail_on_unmatched_files: true
          files: release-asset/K-One-Kernel-${{ env.DATE }}.zip
          body: |
            ## K-One-Kernel

            Device Target: POCO X8 Pro / Redmi Turbo 5 (`klee`)
            SoC: MediaTek MT6899
            Kernel: `${{ env.VERSION }}`
            Base: GKI `android15-6.6-2025-09`
            Toolchain: Bazel/Kleaf, Clang r510928
            Root: none (KernelSU removed)

            ### Flash
            1. Unduh `K-One-Kernel-${{ env.DATE }}.zip` di bawah (langsung flashable, tanpa ekstrak ganda)
            2. Recovery → Install → pilih file itu
            3. Reboot

            ### PENTING sebelum flash
            `CONFIG_LOCALVERSION` ikut ter-embed ke `vermagic` setiap modul.
            Pastikan `adb shell uname -r` di perangkat menghasilkan string yang
            sama persis dengan `Kernel Version` di atas. Jika berbeda, modul
            vendor akan gagal dimuat.

            ### Changelog
            - read the commits.
