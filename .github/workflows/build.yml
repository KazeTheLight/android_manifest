name: Build Kernel and Release

on:
  workflow_dispatch:
    inputs:
      package_full:
        description: 'Buat artifact lengkap (~900MB)? false = hanya Image kecil'
        type: boolean
        default: true

env:
  KERNEL_MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  KERNEL_MANIFEST_BRANCH: common-android15-6.6-2025-09
  LOCAL_MANIFEST_REPO: https://github.com/KazeTheLight/android_manifest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.setdate.outputs.date }}
    steps:
      - name: Generate build date
        id: setdate
        run: echo "date=$(TZ=Asia/Jakarta date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build_kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    needs: prepare
    env:
      DATE: ${{ needs.prepare.outputs.date }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set environment
        run: |
          echo "ARTIFACT=$GITHUB_WORKSPACE/artifact" >> "$GITHUB_ENV"
          echo "IMGOUT=$GITHUB_WORKSPACE/image-out" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          sudo apt-get update -y
          sudo apt-get install -y device-tree-compiler python3 lz4

      - name: Sync kernel source
        run: |
          repo init -u "$KERNEL_MANIFEST_URL" -b "$KERNEL_MANIFEST_BRANCH" --depth=1
          git clone "$LOCAL_MANIFEST_REPO" .repo/local_manifests
          repo sync --force-sync --no-clone-bundle --no-tags -j"$(nproc --all)"

      - name: Fix Ubuntu 24.04 sandbox restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build kernel
        run: ./kernel_device_modules-6.6/build.sh

      - name: Petakan hasil build
        run: |
          set -euo pipefail
          echo "=== out/ ==="
          ls -la out/ 2>/dev/null || echo "  (tidak ada out/)"
          echo
          echo "=== kandidat Image / vmlinux di out/dist ==="
          find out/dist -type f \( -name "Image" -o -name "Image.*" -o -name "Image-*" -o -name "vmlinux" \) \
            -printf "%10s  %p\n" 2>/dev/null | sort -rn | head -20
          echo
          echo "=== struktur out/dist (depth 2) ==="
          find out/dist -maxdepth 2 2>/dev/null | head -50

      - name: Ekstrak Image + laporkan versi
        run: |
          set -euo pipefail
          mkdir -p "$IMGOUT"

          IMG=$(find out/dist -type f \
                  \( -name "Image" -o -name "Image.*" -o -name "Image-*" \) \
                  ! -name "*.dtb" -printf "%s\t%p\n" 2>/dev/null \
                | sort -rn | head -1 | cut -f2-)

          if [ -z "$IMG" ]; then
            echo "::error:: tidak ada file Image di out/dist"
            exit 1
          fi

          echo "=== IMAGE TERPILIH: $IMG ==="
          ls -la "$IMG"
          file "$IMG" || true
          sha256sum "$IMG"
          cp "$IMG" "$IMGOUT/$(basename "$IMG")"
          echo
          echo "=== isi $IMGOUT ==="
          ls -la "$IMGOUT/"

      - name: Baca version string dari dalam Image
        run: |
          set -euo pipefail
          for f in "$IMGOUT"/*; do
            [ -f "$f" ] || continue
            echo "######## $(basename "$f") ########"
            echo "--- 32 byte pertama ---"
            xxd -l 32 "$f" || true
            TMP=$(mktemp)
            case "$f" in
              *.gz)  gunzip -c "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *.lz4) lz4 -d -c "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *.xz)  xz -dc  "$f" > "$TMP" 2>/dev/null || cp "$f" "$TMP" ;;
              *)     cp "$f" "$TMP" ;;
            esac
            echo "--- Linux version string ---"
            VER=$(strings "$TMP" | grep -m1 -E "Linux version [0-9]" || true)
            if [ -n "$VER" ]; then
              echo "$VER"
              echo "VERSION=${VER#Linux version }" >> "$GITHUB_ENV"
              echo "::notice title=Versi Kernel::$VER"
            else
              echo "  (tidak ketemu)"
            fi
            echo "--- jejak klee ---"
            strings "$TMP" | grep -m3 -iE "klee" || echo "  (tidak ada)"
            rm -f "$TMP"
            echo
          done

      - name: Paket artifact lengkap
        if: inputs.package_full
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT"
          cd out/dist
          zip -r9 "$ARTIFACT/kernel-${DATE}.zip" .
          ls -la "$ARTIFACT/"

      - name: Upload Image kecil
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.DATE }}
          path: ${{ env.IMGOUT }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact lengkap
        if: inputs.package_full
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.DATE }}
          path: ${{ env.ARTIFACT }}/*
          retention-days: 14

  create_release:
    name: Create Release
    needs: [prepare, build_kernel]
    runs-on: ubuntu-latest
    if: inputs.package_full
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup git authentication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Create git tag
        run: |
          git tag -a "$TAG" -m "Beyond what's right, i want to live with you, raa."
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: artifact/**
          body: |
            Device Target: POCO X8 Pro
            Kernel Manifest: https://github.com/KazeTheLight/android_manifest.git
            Kernel Branch: android15-6.6-2025-09 (GKI 6.6.89)
            Clang Version: - (we're using bazel)

            ### Changelog:
            - just read the commits.
